name: Collect Civ 7 player count

on:
  schedule:
    # Every 30 minutes (UTC). GitHub may delay scheduled runs under load.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # allow manual runs

permissions:
  contents: write

concurrency:
  group: civ7-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Re-runs check out the triggering SHA, which may be behind the branch
      # tip after later scheduled runs. Move to the latest commit so the push
      # fast-forwards and we build the dashboard from the freshest data.
      - name: Sync to latest remote
        run: |
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard "origin/${GITHUB_REF_NAME}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect current player count
        run: python collect.py

      - name: Rebuild dashboard
        run: python dashboard.py
        env:
          DISPLAY_TZ: Europe/London

      # GitHub Pages (Deploy from a branch) serves index.html directly and
      # rebuilds on every push, so committing the data + dashboard is all we
      # need to refresh the live site.
      - name: Commit data point
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/civ7_players.csv index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "data: civ7 player count $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected; syncing and retrying ($i)..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || git rebase --abort
            sleep $((2 ** i))
          done
          echo "Push failed after retries." >&2
          exit 1
