name: Collect Civ 7 player count

on:
  schedule:
    # Every 30 minutes (UTC). GitHub may delay scheduled runs under load.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # allow manual runs

# contents: commit the data point back; pages/id-token: publish the dashboard.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: civ7-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect current player count
        run: python collect.py

      - name: Rebuild dashboard
        run: python dashboard.py
        env:
          DISPLAY_TZ: Europe/London

      - name: Commit data point
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/civ7_players.csv dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: civ7 player count $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
