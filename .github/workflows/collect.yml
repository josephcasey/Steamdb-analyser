name: Collect Civ 7 player count

on:
  schedule:
    # Hourly, on the hour (UTC). GitHub may delay scheduled runs under load.
    - cron: "0 * * * *"
  workflow_dispatch: {}  # allow manual runs

permissions:
  contents: write

concurrency:
  group: civ7-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect current player count
        run: python collect.py

      - name: Rebuild dashboard
        run: python dashboard.py

      - name: Commit data point
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/civ7_players.csv dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "data: civ7 player count $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
